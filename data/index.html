<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Управления Нагрузками</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --card-active: #22252a;
            --text-color: #e1e1e6;
            --primary: #4caf50;
            --accent: #2196f3;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        .container { max-width: 1000px; width: 100%; }
        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; border-bottom: 1px solid #29292e; padding-bottom: 15px;
        }
        .top-header {
            position: relative;
            width: 100%;
            text-align: center;
            padding: 15px 10px;
            background-color: #1e1e24; /* Цвет подложки под ваш дизайн */
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        /* Контейнер часов */
        .clock-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 8px;
            }

        /* Время */
        #live-time {
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #00e676; /* Приятный неоново-зеленый цвет */
            font-variant-numeric: tabular-nums; /* Защита от дрожания ширины цифр */
        }

            /* Дата (под временем) */
        #live-date {
            font-size: 0.9rem;
            color: #a0a0a0;
            margin-top: 2px;
        }

        h1 { margin: 0; font-size: 24px; font-weight: 600; }
        .nav-links a { color: var(--accent); text-decoration: none; margin-right: 15px; font-size: 14px; }
        .nav-links a:hover { text-decoration: underline; }
        .summary { font-size: 16px; background: #202024; padding: 8px 16px; border-radius: 20px; border: 1px solid #29292e; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }

        .load-card {
            background-color: var(--card-bg); border: 1px solid #29292e; border-radius: 12px;
            padding: 15px; display: flex; flex-direction: column; align-items: center;
            justify-content: space-between; height: 150px; transition: all 0.3s ease; position: relative;
        }
        .load-card.active { background-color: var(--card-active); border-color: var(--primary); box-shadow: 0 4px 20px rgba(76, 175, 80, 0.15); }

        /* Блок заголовка с кнопкой изменения имени */
        .title-container { display: flex; align-items: center; gap: 8px; max-width: 90%; }
        .load-title { font-size: 16px; font-weight: 500; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .edit-name-btn { background: none; border: none; color: #666; cursor: pointer; font-size: 14px; padding: 2px; }
        .edit-name-btn:hover { color: var(--accent); }

        /* Инпут изменения имени */
        .name-input {
            background: #09090a; border: 1px solid var(--accent); border-radius: 4px;
            color: #fff; font-size: 14px; padding: 4px 8px; width: 120px; text-align: center; outline: none;
        }
        .save-name-btn { background: none; border: none; color: var(--primary); cursor: pointer; font-size: 14px; font-weight: bold; }

        .status-text { font-size: 13px; color: #888; margin: 5px 0; font-weight: bold; }
        .switch { position: relative; display: inline-block; width: 60px; height: 34px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #3e3e42; transition: .3s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 26px; width: 26px; left: 4px; bottom: 4px; background-color: #fff; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(26px); }

        .console-box { background: #09090a; border: 1px solid #29292e; border-radius: 8px; padding: 15px; width: 100%; box-sizing: border-box; }
        .console-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #666; margin-bottom: 10px; }
        .console { font-family: monospace; font-size: 13px; color: #00ff66; height: 100px; overflow-y: auto; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>Управление устройствами</h1>
            <div class="nav-links">
                <a href="/files">Файловый менеджер</a>
                <a href="/wifi">Настройки Wi-Fi</a>
            </div>
        </div>
        <div class="clock-container">
            <div id="live-time">--:--:--</div>
            <div id="live-date">--.--.----</div>
        </div>
        <div class="summary">Активно нагрузок: <span id="activeCount">0</span>/8</div>
    </header>

    <div class="grid" id="loadsContainer">
        <!-- Карточки будут добавлены скриптом из второй части -->
    </div>

    <div class="console-box">
        <div class="console-title">Лог системных событий</div>
        <div class="console" id="logConsole"></div>
    </div>
</div>
<script>
    const TOTAL_LOADS = 8;

    document.addEventListener("DOMContentLoaded", () => {
        loadCurrentStates();
    });

    function loadCurrentStates() {
        logMessage("Запрос конфигурации JSON с ESP32...");
        fetch('/get_states')
            .then(response => { if (!response.ok) throw new Error('Ошибка связи'); return response.json(); })
            .then(data => {
                const container = document.getElementById("loadsContainer");
                container.innerHTML = "";

                for (let i = 0; i < TOTAL_LOADS; i++) {
                    const loadData = data[`Load${i}`] || [`Нагрузка ${i+1}`, 0];
                    const loadName = loadData[0];
                    const loadState = loadData[1];

                    const card = document.createElement("div");
                    card.className = "load-card" + (loadState === 1 ? " active" : "");
                    card.id = `card-${i}`;

                    card.innerHTML = `
                        <div class="title-container" id="titleBox-${i}">
                            <div class="load-title" id="nameText-${i}">${loadName}</div>
                            <button class="edit-name-btn" onclick="enableNameEdit(${i}, '${loadName}')">✏️</button>
                        </div>
                        <div class="status-text" id="status-${i}">${loadState === 1 ? 'Включено' : 'Выключено'}</div>
                        <label class="switch">
                            <input type="checkbox" id="toggle-${i}" ${loadState === 1 ? 'checked' : ''} onchange="handleToggle(${i}, this.checked)">
                            <span class="slider"></span>
                        </label>
                    `;
                    container.appendChild(card);

                    const statusText = document.getElementById(`status-${i}`);
                    if (statusText) statusText.style.color = (loadState === 1) ? "#4caf50" : "#888";
                }
                updateActiveCount();
                logMessage("Интерфейс успешно синхронизирован с config.json.");
            })
            .catch(error => { logMessage(`Ошибка синхронизации: ${error.message}`); });
    }

    function enableNameEdit(id, oldName) {
        const titleBox = document.getElementById(`titleBox-${id}`);
        titleBox.innerHTML = `
            <input type="text" class="name-input" id="input-${id}" value="${oldName}" maxlength="20">
            <button class="save-name-btn" onclick="saveNewName(${id})">✔️</button>
        `;
        document.getElementById(`input-${id}`).focus();
    }

    function saveNewName(id) {
        const inputVal = document.getElementById(`input-${id}`).value.trim();
        if(!inputVal) return;

        logMessage(`Переименование: Нагрузка ${id} -> "${inputVal}"`);

        const formData = new URLSearchParams();
        formData.append('id', id);
        formData.append('name', inputVal);

        fetch('/rename_load', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formData.toString()
        })
        .then(response => {
            if (response.ok) {
                logMessage(`Имя нагрузки ${id+1} успешно обновлено.`);
                const titleBox = document.getElementById(`titleBox-${id}`);
                titleBox.innerHTML = `
                    <div class="load-title" id="nameText-${id}">${inputVal}</div>
                    <button class="edit-name-btn" onclick="enableNameEdit(${id}, '${inputVal}')">✏️</button>
                `;
            } else { throw new Error(`Код ${response.status}`); }
        })
        .catch(error => { logMessage(`Ошибка смены имени: ${error.message}`); loadCurrentStates(); });
    }

    function handleToggle(id, isChecked) {
        updateCardVisual(id, isChecked);
        updateActiveCount();

        const stateValue = isChecked ? "1" : "0";
        const formData = new URLSearchParams();
        formData.append('id', id);
        formData.append('state', stateValue);

        fetch('/set_state', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: formData.toString()
        })
        .then(response => { if (!response.ok) throw new Error(`Код ${response.status}`); })
        .catch(error => {
            logMessage(`Ошибка: ${error.message}`);
            const checkbox = document.getElementById(`toggle-${id}`);
            if (checkbox) { checkbox.checked = !isChecked; updateCardVisual(id, !isChecked); updateActiveCount(); }
        });
    }

    function updateCardVisual(id, isChecked) {
        const card = document.getElementById(`card-${id}`);
        const statusText = document.getElementById(`status-${id}`);
        if (!card || !statusText) return;
        if (isChecked) { card.classList.add("active"); statusText.innerText = "Включено"; statusText.style.color = "#4caf50"; }
        else { card.classList.remove("active"); statusText.innerText = "Выключено"; statusText.style.color = "#888"; }
    }

    function updateActiveCount() {
        let activeCount = 0;
        for (let i = 0; i < TOTAL_LOADS; i++) {
            const checkbox = document.getElementById(`toggle-${i}`);
            if (checkbox && checkbox.checked) activeCount++;
        }
        const counterEl = document.getElementById("activeCount");
        if (counterEl) counterEl.innerText = activeCount;
    }

    function logMessage(msg) {
        const logConsole = document.getElementById("logConsole");
        if (logConsole) {
            const time = new Date().toLocaleTimeString();
            logConsole.innerHTML += `[${time}] ${msg}\n`;
            logConsole.scrollTop = logConsole.scrollHeight;
        }
    }
let serverEpochMs = null;

  async function syncServerTime() {
    try {
      const response = await fetch('/api/time');
      if (!response.ok) throw new Error('Network response was not ok');
      const timeStr = (await response.text()).trim();

      // Ожидаемый формат от ESP: "YYYY-MM-DDTHH:MM:SS"
      const [datePart, timePart] = timeStr.split('T');
      if (datePart && timePart) {
        const [year, month, day] = datePart.split('-').map(Number);
        const [hours, minutes, seconds] = timePart.split(':').map(Number);

        // Используем Date.UTC, чтобы зафиксировать точные цифры с ESP без наложения таймзоны браузера
        serverEpochMs = Date.UTC(year, month - 1, day, hours, minutes, seconds);
        updateDisplay();
      }
    } catch (e) {
      console.warn("Синхронизация времени с ESP не удалась:", e);
    }
  }

  function pad(num) {
    return num.toString().padStart(2, '0');
  }

  function updateDisplay() {
    if (serverEpochMs === null) return;

    // Считываем значения в режиме UTC, чтобы браузер ничего не сдвигал
    const d = new Date(serverEpochMs);
    const hours = pad(d.getUTCHours());
    const minutes = pad(d.getUTCMinutes());
    const seconds = pad(d.getUTCSeconds());
    const day = pad(d.getUTCDate());
    const month = pad(d.getUTCMonth() + 1);
    const year = d.getUTCFullYear();

    const timeEl = document.getElementById('live-time');
    const dateEl = document.getElementById('live-date');

    if (timeEl) timeEl.textContent = `${hours}:${minutes}:${seconds}`;
    if (dateEl) dateEl.textContent = `${day}.${month}.${year}`;
  }

  function tick() {
    if (serverEpochMs !== null) {
      serverEpochMs += 1000;
      updateDisplay();
    }
  }

  // Запуск первой синхронизации и старт локального таймера
  syncServerTime().then(() => {
    setInterval(tick, 1000);
  });

  // Фоновая синхронизация с ESP каждые 5 минут для устранения дрейфа генератора
  setInterval(syncServerTime, 300000);
</script>
</body>
</html>
