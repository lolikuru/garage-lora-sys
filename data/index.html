<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Управления Нагрузками</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --card-active: #22252a;
            --text-color: #e1e1e6;
            --primary: #4caf50;
            --accent: #2196f3;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 1000px;
            width: 100%;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #29292e;
            padding-bottom: 15px;
        }
        h1 { margin: 0; font-size: 24px; font-weight: 600; }
        .nav-links a {
            color: var(--accent);
            text-decoration: none;
            margin-right: 15px;
            font-size: 14px;
        }
        .nav-links a:hover { text-decoration: underline; }
        .summary {
            font-size: 16px;
            background: #202024;
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #29292e;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .load-card {
            background-color: var(--card-bg);
            border: 1px solid #29292e;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 140px;
            transition: all 0.3s ease;
        }
        .load-card.active {
            background-color: var(--card-active);
            border-color: var(--primary);
            box-shadow: 0 4px 20px rgba(76, 175, 80, 0.15);
        }
        .load-title {
            font-size: 18px;
            font-weight: 500;
        }
        .status-text {
            font-size: 14px;
            color: #888;
            margin: 10px 0;
            font-weight: bold;
        }
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #3e3e42;
            transition: .3s;
            border-radius: 34px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 26px; width: 26px;
            left: 4px; bottom: 4px;
            background-color: #fff;
            transition: .3s;
            border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(26px); }

        .console-box {
            background: #09090a;
            border: 1px solid #29292e;
            border-radius: 8px;
            padding: 15px;
            width: 100%;
            box-sizing: border-box;
        }
        .console-title {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #666;
            margin-bottom: 10px;
        }
        .console {
            font-family: monospace;
            font-size: 13px;
            color: #00ff66;
            height: 120px;
            overflow-y: auto;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>Управление устройствами</h1>
            <div class="nav-links">
                <a href="/files">Файловый менеджер</a>
                <a href="/wifi">Настройки Wi-Fi</a>
            </div>
        </div>
        <div class="summary">Активно нагрузок: <span id="activeCount">0</span>/8</div>
    </header>

    <div class="grid" id="loadsContainer">
        <!-- Карточки генерируются скриптом -->
    </div>

    <div class="console-box">
        <div class="console-title">Лог системных событий</div>
        <div class="console" id="logConsole"></div>
    </div>
</div>

<script>
    const TOTAL_LOADS = 8;

    document.addEventListener("DOMContentLoaded", () => {
        initDashboard();
        loadCurrentStates();
    });

    function initDashboard() {
        const container = document.getElementById("loadsContainer");
        container.innerHTML = "";

        for (let i = 0; i < TOTAL_LOADS; i++) {
            const card = document.createElement("div");
            card.className = "load-card";
            card.id = `card-${i}`;

            card.innerHTML = `
                <div class="load-title">Нагрузка ${i + 1}</div>
                <div class="status-text" id="status-${i}">Выключено</div>
                <label class="switch">
                    <input type="checkbox" id="toggle-${i}" onchange="handleToggle(${i}, this.checked)">
                    <span class="slider"></span>
                </label>
            `;
            container.appendChild(card);
        }
    }

    function loadCurrentStates() {
        logMessage("Запрос состояния нагрузок с сервера...");
        fetch('/get_states')
            .then(response => {
                if (!response.ok) throw new Error('Ошибка сети при чтении состояний');
                return response.json();
            })
            .then(data => {
                const states = data.loads || [];

                states.forEach((state, i) => {
                    if (i < TOTAL_LOADS) {
                        const checkbox = document.getElementById(`toggle-${i}`);
                        if (checkbox) {
                            checkbox.checked = (state === 1);
                            updateCardVisual(i, state === 1);
                        }
                    }
                });
                updateActiveCount();
                logMessage("Синхронизация с ESP32 успешно выполнена.");
            })
            .catch(error => {
                logMessage(`Ошибка синхронизации: ${error.message}`);
                console.error(error);
            });
    }

    function handleToggle(id, isChecked) {
        updateCardVisual(id, isChecked);
        updateActiveCount();

        const stateValue = isChecked ? "1" : "0";
        logMessage(`Изменение: Нагрузка ${id + 1} -> ${isChecked ? 'ВКЛ' : 'ВЫКЛ'}`);

        const formData = new URLSearchParams();
        formData.append('id', id);
        formData.append('state', stateValue);

        fetch('/set_state', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: formData.toString()
        })
        .then(response => {
            if (response.ok) {
                logMessage(`Успешно: Ответ ESP32 подтвержден для Нагрузки ${id + 1}.`);
            } else {
                throw new Error(`Код ответа сервера: ${response.status}`);
            }
        })
        .catch(error => {
            logMessage(`Ошибка отправки команды: ${error.message}`);
            const checkbox = document.getElementById(`toggle-${id}`);
            if (checkbox) {
                checkbox.checked = !isChecked;
                updateCardVisual(id, !isChecked);
                updateActiveCount();
            }
        });
    }

    function updateCardVisual(id, isChecked) {
        const card = document.getElementById(`card-${id}`);
        const statusText = document.getElementById(`status-${id}`);

        if (isChecked) {
            card.classList.add("active");
            statusText.innerText = "Включено";
            statusText.style.color = "#4caf50";
        } else {
            card.classList.remove("active");
            statusText.innerText = "Выключено";
            statusText.style.color = "#888";
        }
    }

    function updateActiveCount() {
        let activeCount = 0;
        for (let i = 0; i < TOTAL_LOADS; i++) {
            const checkbox = document.getElementById(`toggle-${i}`);
            if (checkbox && checkbox.checked) activeCount++;
        }
        const counterEl = document.getElementById("activeCount");
        if (counterEl) counterEl.innerText = activeCount;
    }

    function logMessage(msg) {
        const logConsole = document.getElementById("logConsole");
        if (logConsole) {
            const time = new Date().toLocaleTimeString();
            logConsole.innerHTML += `[${time}] ${msg}\n`;
            logConsole.scrollTop = logConsole.scrollHeight;
        }
    }
</script>
</body>
</html>
