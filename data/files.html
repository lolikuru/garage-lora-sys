<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Файловый менеджер LittleFS</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1a1a1e;
            --text-color: #e1e1e6;
            --accent: #2196f3;
            --accent-hover: #1e88e5;
            --border-color: #29292e;
            --danger: #f44336;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
        header {
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { margin: 0; font-size: 24px; font-weight: 600; }

        .file-system-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
            font-size: 15px;
        }
        li:last-child {
            border-bottom: none;
        }
        li strong {
            color: #a8a8b3;
            font-weight: 500;
        }
        li a {
            color: var(--text-color);
            text-decoration: none;
            flex-grow: 1;
            transition: color 0.2s;
        }
        li a:hover {
            color: var(--accent);
        }

        /* Стилизация служебных кнопок действий */
        .actions {
            display: flex;
            gap: 15px;
            margin-left: 20px;
        }
        .actions a {
            font-size: 13px;
            padding: 4px 8px;
            border-radius: 4px;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .actions a:hover {
            opacity: 0.8;
        }
        .btn-download {
            background-color: #2e2f34;
            color: var(--accent) !important;
            border: 1px solid #3e3e42;
        }
        .btn-edit {
            background-color: #2e2f34;
            color: #4caf50 !important;
            border: 1px solid #3e3e42;
        }

        .btn-back {
            display: inline-block;
            background-color: transparent;
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
            margin-top: 25px;
            transition: color 0.2s;
        }
        .btn-back:hover { text-decoration: underline; color: var(--accent-hover); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Файловый менеджер</h1>
    </header>

    <div class="file-system-box">
        <ul id="fileList">
            <!-- Сюда функция listFiles() на ESP32 будет динамически подставлять строки вида: -->
            <!-- <li><a href='/download?file=/index.html'>index.html</a> (1234 bytes) <div class='actions'><a href='/edit?file=/index.html' class='btn-edit'>[Edit]</a></div></li> -->
        </ul>
    </div>

    <a href="/" class="btn-back">← Назад в главное меню</a>
</div>

</body>
</html>
